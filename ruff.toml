# Правила линтера: базовый набор (E/F), длина строки и версия Python.
#: Набор правил намеренно явный: `select` по умолчанию меняется между версиями ruff, а «тихо другая
#: строгость» в проверке — это разные результаты у двух людей на одном коде.
line-length = 110
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
